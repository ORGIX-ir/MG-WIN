name: Build Windows Setup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Expand complete source package
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'mgwin-source'
          Expand-Archive -LiteralPath 'source/MG-WIN-source.zip' -DestinationPath $destination -Force
          $root = Join-Path $destination 'MG-WIN'
          if (-not (Test-Path (Join-Path $root 'src/MGWin.App/MGWin.App.csproj'))) {
            throw 'The source archive does not contain the expected WPF project.'
          }
          "MGWIN_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run core smoke tests
        shell: pwsh
        run: dotnet run --project "$env:MGWIN_ROOT/tests/MGWin.SmokeTests/MGWin.SmokeTests.csproj" --configuration Release

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          dotnet publish "$env:MGWIN_ROOT/src/MGWin.App/MGWin.App.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "$env:MGWIN_ROOT/publish/win-x64" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = Get-ChildItem -Path 'C:\Program Files', 'C:\Program Files (x86)' -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compiler) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }
          & $compiler "$env:MGWIN_ROOT/installer/MG-WIN.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = "$env:MGWIN_ROOT/installer/artifacts/MG-WIN-Setup.exe"
          if (-not (Test-Path $setup)) { throw 'Setup executable was not created.' }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          "SHA-256: $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload installer only
        uses: actions/upload-artifact@v4
        with:
          name: MG-WIN-Setup
          path: ${{ runner.temp }}/mgwin-source/MG-WIN/installer/artifacts/MG-WIN-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
